[package]
name = "arc-recall-desktop"
version = "0.1.0"
description = "ArcRecall desktop application"
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "arc_recall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arc-recall-core = { path = "../crates/arc-recall-core" }
keyring = "4.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
