[package]
name = "arc-recall-desktop"
version = "0.3.0"
description = "ArcRecall desktop application"
edition = "2024"
license.workspace = true
repository.workspace = true

[lib]
name = "arc_recall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
arc-recall-core = { path = "../crates/arc-recall-core" }
hex = "0.4"
keyring = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
