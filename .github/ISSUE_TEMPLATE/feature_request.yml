name: Feature request
description: Suggest an improvement or new capability for ArcRecall
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case first. A concrete example helps explain why the change matters.

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what currently makes it difficult?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or result you would like to see.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Related component
      options:
        - Desktop app
        - Web app
        - Rust service
        - Project setup or documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or alternative designs you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, mockups, or references that help explain the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
