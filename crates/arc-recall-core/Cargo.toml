[package]
name = "arc-recall-core"
version = "0.1.0"
description = "Platform-independent core for ArcRecall"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
