[package]
name = "arc-recall-core"
version = "0.1.0"
description = "Platform-independent core for ArcRecall"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = "0.6"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
